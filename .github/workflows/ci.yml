name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cmake:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenMP runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libomp-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Weightless tests (tiny oracle, config refusals, safetensors)
        run: ctest --test-dir build -C Release --output-on-failure

  make:
    name: make test (ubuntu, ${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libomp-dev
      - run: make CC=${{ matrix.cc }} ARCH="-mavx2 -mfma" test -j"$(nproc)"

  werror:
    name: warnings as errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libomp-dev
      - run: make ARCH="-mavx2 -mfma" CFLAGS="-O2 -std=gnu99 -Wall -Wextra -Wpointer-arith -Wshadow -Wvla -Wno-unused-parameter -Wno-unused-function -Werror -fopenmp -pthread -ffp-contract=off -mavx2 -mfma" all
