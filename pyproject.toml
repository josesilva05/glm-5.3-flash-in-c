[project]
name = "glm-5.3-flash-in-c"
version = "2.0.0"
description = "Python tooling for the GLM-5.3-Flash C engine: reference forward, tiny oracle fixture, tokenizer parity"
requires-python = ">=3.10"
# Pinned exact so the reference the C engine is graded against does not drift.
dependencies = [
    "numpy",
    "safetensors",
    "torch==2.14.0",
    "transformers==5.17.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.9",
]
